name: Monorepo CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Supabase Vite env
        working-directory: ${{ github.workspace }}
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SECRET_SUPABASE_URL:-}"
          KEY="${SECRET_SUPABASE_ANON_KEY:-}"
          if [ -z "$URL" ]; then URL="https://example.supabase.co"; fi
          if [ -z "$KEY" ]; then KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder"; fi
          echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ENV_RESOLVED=1"

      - name: Build
        run: npm run build

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install env-config
        working-directory: .
        run: |
          npm ci --prefix packages/env-config
          npm run build --prefix packages/env-config

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
