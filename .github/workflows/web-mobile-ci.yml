name: Web & Mobile CI

on:
  push:
    paths:
      - 'web/**'
      - 'mobile/**'
      - '.github/workflows/web-mobile-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'mobile/**'
      - '.github/workflows/web-mobile-ci.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Supabase Vite env
        working-directory: ${{ github.workspace }}
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SECRET_SUPABASE_URL:-}"
          KEY="${SECRET_SUPABASE_ANON_KEY:-}"
          if [ -z "$URL" ]; then URL="https://example.supabase.co"; fi
          if [ -z "$KEY" ]; then KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder"; fi
          echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ENV_RESOLVED=1"

      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
