# CI PIPELINE ENGINE
# Protects main with typecheck + isolated core lifecycle simulation.
# Strict rule: uppercase text-only logging; no emoji in names or output.

name: CI PIPELINE ENGINE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-validate:
    name: CORE VALIDATE (NODE ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ['20.x']

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vendorly
          POSTGRES_PASSWORD: vendorly
          POSTGRES_DB: vendorly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendorly -d vendorly_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI_DATABASE_URL: postgresql://vendorly:vendorly@localhost:5432/vendorly_ci

    steps:
      - name: CHECKOUT SOURCE
        uses: actions/checkout@v4

      - name: SETUP NODE ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: INSTALL DEPENDENCIES
        run: |
          echo "INSTALLING ROOT DEPENDENCIES"
          npm ci
          echo "INSTALLING ENV CONFIG PACKAGE"
          npm ci --prefix packages/env-config
          npm run build --prefix packages/env-config
          echo "INSTALLING BACKEND DEPENDENCIES"
          npm ci --prefix backend
          echo "GENERATING PRISMA CLIENT"
          npm run prisma:generate --prefix backend
          echo "PASS: DEPENDENCY INSTALL COMPLETE"

      - name: DATABASE MIGRATION CHECK
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          echo "RUNNING DATABASE MIGRATION CHECK"
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          node scripts/ci-migration-check.mjs
          echo "PASS: DATABASE MIGRATION CHECK COMPLETE"

      - name: GLOBAL TYPECHECK
        run: |
          echo "RUNNING GLOBAL TYPECHECK BUILD"
          npx tsc --noEmit
          echo "RUNNING ENV CONFIG TYPECHECK BUILD"
          npm run typecheck --prefix packages/env-config
          echo "RUNNING BACKEND TYPECHECK BUILD"
          npm exec --prefix backend -- tsc --noEmit
          echo "PASS: GLOBAL TYPECHECK BUILD COMPLETE"

  core-simulation:
    name: CORE LIFECYCLE SIMULATION (NODE ${{ matrix.node-version }})
    needs: core-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ['20.x']

    env:
      NODE_ENV: development
      PORT: '4000'
      POS_QUEUES_ENABLED: 'false'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VITE_API_URL: http://127.0.0.1:4000
      NEST_API_URL: http://127.0.0.1:4000
      API_URL: http://127.0.0.1:4000

    steps:
      - name: CHECKOUT SOURCE
        uses: actions/checkout@v4

      - name: SETUP NODE ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: INSTALL DEPENDENCIES
        run: |
          echo "INSTALLING ROOT DEPENDENCIES"
          npm ci
          echo "INSTALLING ENV CONFIG PACKAGE"
          npm ci --prefix packages/env-config
          npm run build --prefix packages/env-config
          echo "INSTALLING BACKEND DEPENDENCIES"
          npm ci --prefix backend
          echo "GENERATING PRISMA CLIENT"
          npm run prisma:generate --prefix backend
          echo "PASS: DEPENDENCY INSTALL COMPLETE"

      - name: VERIFY SIMULATION SECRETS
        run: |
          echo "VERIFYING SIMULATION ENVIRONMENT BASELINE"
          if [ -z "${DATABASE_URL}" ]; then
            echo "FAIL: DATABASE_URL SECRET MISSING"
            exit 1
          fi
          if [ -z "${SUPABASE_URL}" ]; then
            echo "FAIL: SUPABASE_URL SECRET MISSING"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "FAIL: SUPABASE_ANON_KEY SECRET MISSING"
            exit 1
          fi
          echo "PASS: SIMULATION SECRETS PRESENT"
          echo "RUNNING SERVER ENV SCHEMA VALIDATION"
          node -e "require('./packages/env-config').validateServerEnv(process.env); console.log('PASS: SERVER ENV SCHEMA VALID')"

      - name: SEED DENVER NETWORK LAYOUT
        run: |
          echo "SEEDING HIGH DENSITY DENVER ENTITY LAYOUT"
          npm run db:seed:network
          echo "PASS: DENVER NETWORK SEED COMPLETE"

      - name: START API SERVER
        run: |
          echo "STARTING NEST API SERVER"
          npm run start:dev --prefix backend > /tmp/vendorly-api.log 2>&1 &
          echo $! > /tmp/vendorly-api.pid
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4000/health/live" >/dev/null 2>&1; then
              echo "PASS: API SERVER READY"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: API SERVER FAILED TO BECOME READY"
          tail -n 200 /tmp/vendorly-api.log || true
          exit 1

      - name: STARTING CORE LIFECYCLE SIMULATION HARNESS
        run: |
          echo "STARTING CORE LIFECYCLE SIMULATION HARNESS"
          npm run test:integration:core
          echo "PASS: CORE LIFECYCLE SIMULATION HARNESS COMPLETE"

      - name: STOP API SERVER
        if: always()
        run: |
          if [ -f /tmp/vendorly-api.pid ]; then
            kill "$(cat /tmp/vendorly-api.pid)" >/dev/null 2>&1 || true
          fi
          echo "API SERVER SHUTDOWN COMPLETE"
