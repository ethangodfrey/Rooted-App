# Railway production deploy for Vendorly backend.
#
# Service Root Directory: REPOSITORY ROOT (not backend/) so the Dockerfile can
# COPY packages/env-config for @vendorly/env-config.
#
# Build:  Docker multi-stage → npm run build (Nest) inside backend/Dockerfile
# Start:  npm run start:prod  →  node dist/main.js (Dockerfile CMD)
# Port:   Nest binds 0.0.0.0:$PORT (Railway injects PORT; default 4000)
#
# Custom domain: api.vendorlymarketplace.app → CNAME to *.up.railway.app
# Logs: DEPLOYMENT_CONFIG_GENERATED / READY_FOR_RAILWAY (verify script)
# Docs: docs/DEPLOY.md, deploy/ingress.targets.json

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "packages/env-config/**", "deploy/ingress.targets.json"]

[deploy]
# Runtime entry: Dockerfile CMD → npm run start:prod
healthcheckPath = "/api/health"
healthcheckTimeout = 120
overlapSeconds = 30
drainingSeconds = 15
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Keep at least one healthy instance during restarts when capacity allows.
numReplicas = 1

[environments.production.variables]
NODE_ENV = "production"
PORT = "4000"
PUBLIC_BASE_URL = "https://api.vendorlymarketplace.app"
MARKET_ALERT_CRON_ENABLED = "true"
