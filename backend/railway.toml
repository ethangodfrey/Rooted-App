# Railway quick-start for Vendorly backend.
# Root Directory must be the REPOSITORY ROOT (not backend/) so Dockerfile can
# COPY packages/env-config for @vendorly/env-config.
# Custom domain: bind api.vendorly.app -> this service (CNAME to *.up.railway.app).
# Container listens on 0.0.0.0:$PORT (default 4000) for Railway's public proxy.
# Docs: docs/DEPLOY.md, deploy/ingress.targets.json

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "packages/env-config/**", "deploy/ingress.targets.json"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
overlapSeconds = 30
drainingSeconds = 15
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production.variables]
PORT = "4000"
PUBLIC_BASE_URL = "https://api.vendorly.app"
