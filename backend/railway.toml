# Railway quick-start for Vendorly backend.
# Root Directory must be the REPOSITORY ROOT (not backend/) so Dockerfile can
# COPY packages/env-config for @vendorly/env-config.
# Set dockerfilePath to backend/Dockerfile and add env vars from .env.example.
# Docs: docs/DEPLOY.md

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "packages/env-config/**"]

[deploy]
healthcheckPath = "/health/live"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
